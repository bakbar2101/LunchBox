<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LunchBox Express - Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="auth-container bg-white rounded-xl shadow-lg overflow-hidden w-full max-w-md">
        <div class="auth-header bg-blue-600 p-6 text-white">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <i data-feather="package"></i> LunchBox
            </h1>
            <p class="text-blue-100 mt-1">Ваш помощник в приготовлении школьных обедов</p>
        </div>
        
        <div class="auth-forms p-6">
            <!-- Login Form -->
            <form id="loginForm" class="login-form">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2" for="loginEmail">Электронная почта</label>
                    <input type="email" id="loginEmail" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="email" required>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 mb-2" for="loginPassword">Пароль</label>
                    <input type="password" id="loginPassword" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="••••••••" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-3 px-4 rounded-lg hover:bg-blue-700 transition duration-200 flex items-center justify-center gap-2">
                    <i data-feather="log-in"></i> Регистрация
                </button>
                <div class="mt-4 text-center">
                    <a href="#" id="forgotPassword" class="text-blue-600 hover:text-blue-800 text-sm">Забыли пароль?</a>
                </div>
            </form>
            
            <!-- Registration Link -->
            <div class="register-prompt mt-6 pt-6 border-t border-gray-200 text-center">
                <p class="text-gray-600">У вас нет аккаунта?</p>
                <a href="register.html" class="mt-2 inline-block bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-700 transition duration-200">
                    Создать аккаунт
                </a>
            </div>
        </div>
    </div>

    <script src="components/navbar.js"></script>
    <script src="script.js"></script>
    <script>
        feather.replace();
    </script>
</body>
</html>
